name: Windows bootstrap

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Install every package from .app-config.yml (including WinGet and GUI apps)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bootstrap:
    uses: RuchirChawdhry/ci-workflows/.github/workflows/windows-bootstrap.yml@main
    with:
      config-path: ${{ inputs.full && '.app-config.yml' || 'tests/ci-app-config.yml' }}
      runs-on: windows-2025
      timeout-minutes: ${{ inputs.full && 300 || 60 }}

  unattended:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Task
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.45.4
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Install ISO tooling
        run: sudo apt-get update && sudo apt-get install -y xorriso
      - name: Validate unattended installation
        shell: pwsh
        run: ./tests/unattended.ps1
