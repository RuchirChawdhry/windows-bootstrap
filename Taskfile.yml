version: '3'

vars:
  PS: pwsh -NoProfile -Command
  LOAD: >-
    $env:SCOOP = "$HOME/Tools/Scoop";
    $env:Path = "$env:SCOOP/shims;$env:Path";
    $env:PSModulePath = "$HOME/Tools/PowerShell/Modules;$env:PSModulePath";
    Import-Module Yayaml;
    $config = Get-Content "$HOME/.app-config.yml" -Raw | ConvertFrom-Yaml;
  APPS: >-
    $apps = $config.scoop.apps.GetEnumerator() | ForEach-Object {
      $bucket = $_.Key;
      $_.Value | ForEach-Object { "$bucket/$_" }
    };

tasks:
  default:
    aliases: [help]
    cmds: [task --list]

  bootstrap:
    aliases: [setup, bs]
    cmds:
      - task: config:init
      - task: modules:install
      - task: managers:install
      - task: buckets:add
      - task: cache:prefetch
      - task: apps:install
      - task: languages:install

  config:init:
    aliases: [config, cfg]
    cmds:
      - >-
        {{.PS}} '(Test-Path "$HOME/.app-config.yml") ? $null :
        (Copy-Item "{{.ROOT_DIR}}/.app-config.yml" "$HOME/.app-config.yml")'

  modules:install:
    aliases: [modules, mods]
    cmds:
      - pwsh -NoProfile -File "{{.ROOT_DIR}}/install-modules.ps1" -Name Yayaml

  managers:install:
    aliases: [managers, pm]
    cmds:
      - |
        {{.PS}} '{{.LOAD}}
          if ($config.scoop.enabled) {
            (Get-Command scoop -EA Ignore) ? $null : (irm get.scoop.sh | iex)
            scoop install git aria2
          }
          if ($config.winget.enabled -and -not (Get-Command winget -EA Ignore)) {
            & "{{.ROOT_DIR}}/install-modules.ps1" -Name Microsoft.WinGet.Client
            Import-Module Microsoft.WinGet.Client
            Repair-WinGetPackageManager -AllUsers
          }
        '

  buckets:add:
    aliases: [buckets]
    cmds:
      - |
        {{.PS}} '{{.LOAD}}
          if ($config.scoop.enabled) {
            $config.scoop.buckets | ForEach-Object {
              $name = ($_ -like "https://*") ? "ruchir" : $_
              ($name -eq "ruchir") ? (scoop bucket add $name $_) : (scoop bucket add $name)
            }
          }
        '

  apps:install:
    aliases: [install, apps:i]
    cmds:
      - task: apps:scoop
      - task: apps:winget

  apps:scoop:
    aliases: [scoop:install]
    cmds:
      - |
        {{.PS}} '{{.LOAD}}
          if ($config.scoop.enabled) {
            {{.APPS}}
            $apps | ForEach-Object { scoop install $_ }
          }
        '

  apps:winget:
    aliases: [winget:install]
    cmds:
      - |
        {{.PS}} '{{.LOAD}}
          if ($config.winget.enabled) {
            $config.winget.apps | ForEach-Object {
              winget install --id $_ -e --accept-package-agreements --accept-source-agreements
            }
          }
        '

  apps:reinstall:
    aliases: [reinstall, apps:r]
    cmds:
      - task: cache:prefetch
      - |
        {{.PS}} '{{.LOAD}}
          if ($config.scoop.enabled) {
            {{.APPS}}
            $apps | Where-Object { $_ -ne "main/task" } | ForEach-Object { scoop update --force $_ }
          }
          if ($config.winget.enabled) {
            $config.winget.apps | ForEach-Object { winget install --id $_ -e --force }
          }
        '

  apps:upgrade:
    aliases: [upgrade, apps:u]
    cmds:
      - |
        {{.PS}} '{{.LOAD}}
          if ($config.scoop.enabled) {
            scoop update
            {{.APPS}}
            $apps | Where-Object { $_ -ne "main/task" } | ForEach-Object { scoop update $_ }
          }
          if ($config.winget.enabled) {
            $config.winget.apps | ForEach-Object { winget upgrade --id $_ -e }
          }
        '

  apps:status:
    aliases: [status, apps:ls]
    cmds:
      - |
        {{.PS}} '{{.LOAD}}
          if ($config.scoop.enabled) { scoop list }
          if ($config.winget.enabled) { winget list }
        '

  languages:install:
    aliases: [languages, langs]
    cmds:
      - |
        {{.PS}} '{{.LOAD}}
          $config.languages | ForEach-Object { scoop install "main/$_" }
        '

  cache:prefetch:
    aliases: [prefetch, cache:download]
    cmds:
      - |
        {{.PS}} '{{.LOAD}}
          if ($config.scoop.enabled) {
            {{.APPS}}
            $apps += $config.languages | ForEach-Object { "main/$_" }
            $apps | ForEach-Object -Parallel { scoop download $_ } -ThrottleLimit 6
          }
        '

  cache:clear:
    aliases: [clean, cache:clean]
    cmds:
      - '{{.PS}} ''{{.LOAD}} scoop cache rm "*"'''

  doctor:
    aliases: [check, health]
    cmds:
      - |
        {{.PS}} '{{.LOAD}}
          if ($config.scoop.enabled) { scoop checkup; scoop status }
          if ($config.winget.enabled) { winget list }
        '
